services:
  - type: web
    name: quiz-ai-online
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_API_URL
        value: https://api.openai.com/v1/chat/completions
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: NODE_VERSION
        value: 20
